<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alya's Maths Adventure</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ── RESET & TOKENS ──────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#FFF8E7;--coral:#FF6B6B;--mint:#6BCB77;
  --sky:#4D96FF;--sun:#FFD93D;--plum:#6A4C93;--ink:#2D2D2D;
  --shadow:0 6px 0 var(--ink);
}
body{font-family:'Fredoka',sans-serif;background:var(--cream);
  background-image:radial-gradient(circle at 10% 20%,rgba(255,217,61,.15) 0%,transparent 40%),
                   radial-gradient(circle at 90% 80%,rgba(107,203,119,.15) 0%,transparent 40%);
  min-height:100vh;color:var(--ink)}
.screen{max-width:480px;margin:0 auto;padding:16px;min-height:100vh}

/* ── NAV ── */
.nav{display:flex;align-items:center;justify-content:space-between;padding:8px 0 14px}
.nav-back{background:white;border:3px solid var(--ink);border-radius:12px;padding:6px 14px;
  font-family:'Fredoka',sans-serif;font-weight:600;font-size:14px;cursor:pointer;
  box-shadow:0 3px 0 var(--ink)}
.nav-back:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.nav-title{font-family:'Caveat',cursive;font-size:24px;color:var(--plum);font-weight:700}
.nav-timer{background:var(--plum);color:white;padding:6px 12px;border-radius:12px;
  font-size:13px;font-weight:600;border:2px solid var(--ink)}

/* ── STUDENT HOME ── */
.home-header{text-align:center;padding:20px 0 14px}
.home-title{font-family:'Caveat',cursive;font-size:46px;color:var(--plum);
  line-height:1;transform:rotate(-2deg);display:inline-block}
.home-sub{font-size:14px;opacity:.65;margin-top:6px}
.cheat-bar{background:var(--sky);color:white;padding:10px 16px;border-radius:14px;
  margin-bottom:16px;text-align:center;font-size:14px;font-weight:500;
  border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.cheat-bar strong{font-family:'Caveat',cursive;font-size:22px}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.menu-card{background:white;border:4px solid var(--ink);border-radius:24px;
  padding:22px 14px;text-align:center;cursor:pointer;box-shadow:var(--shadow)}
.menu-card:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.menu-card.practice{border-color:var(--mint);box-shadow:0 6px 0 #4aaa56}
.menu-card.test{border-color:var(--coral);box-shadow:0 6px 0 #cc4444}
.menu-card.assessment{border-color:var(--sky);box-shadow:0 6px 0 #2f70cc}
.menu-emoji{font-size:50px;display:block;margin-bottom:8px}
.menu-name{font-weight:700;font-size:20px;margin-bottom:3px}
.menu-desc{font-size:12px;opacity:.65}

/* ── PRACTICE ── */
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.level-btn{border:3px solid var(--ink);background:white;padding:9px 4px;
  border-radius:14px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:13px;
  cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.level-btn.active{background:var(--sun)}
.level-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.lvl-num{display:block;font-size:10px;opacity:.65}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.mode-btn{border:2px solid var(--ink);background:white;padding:8px 4px;
  border-radius:12px;font-family:'Fredoka',sans-serif;font-weight:500;font-size:11px;
  cursor:pointer;box-shadow:0 2px 0 var(--ink);text-align:center}
.mode-btn.active{background:var(--mint);color:white}
.mode-btn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--ink)}
.mode-emoji{font-size:18px;display:block;margin-bottom:2px}
.diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.diff-btn{border:3px solid var(--ink);background:white;padding:9px 4px;
  border-radius:14px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:12px;
  cursor:pointer;box-shadow:0 3px 0 var(--ink);text-align:center}
.diff-btn.active.easy{background:#D4EDDA}.diff-btn.active.medium{background:#FFF3CD}
.diff-btn.active.hard{background:#FFE0E0}
.diff-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.review-bar{display:flex;justify-content:space-between;align-items:center;
  background:white;border:2px solid var(--ink);border-radius:14px;padding:8px 14px;margin-bottom:12px}
.review-bar-info{font-size:13px;font-weight:600}
.review-bar-btn{background:var(--plum);color:white;border:none;border-radius:10px;
  padding:6px 14px;font-family:'Fredoka',sans-serif;font-size:12px;font-weight:600;cursor:pointer}

/* ── QUESTION CARD ── */
.card{background:white;border:4px solid var(--ink);border-radius:24px;
  padding:24px 20px;box-shadow:var(--shadow);margin-bottom:14px;
  position:relative;min-height:250px}
.card-badge{position:absolute;top:-14px;left:20px;background:var(--coral);color:white;
  padding:4px 14px;border-radius:20px;font-weight:600;font-size:13px;border:3px solid var(--ink);
  max-width:calc(100% - 40px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-text{text-align:center;font-size:18px;font-weight:500;line-height:1.5;margin:14px 0}
.highlight{background:var(--sun);padding:2px 10px;border-radius:8px;font-weight:700;display:inline-block}
.answer-area{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 0}
.answer-input{width:110px;padding:12px;border:3px solid var(--ink);border-radius:14px;
  font-family:'Fredoka',sans-serif;font-size:22px;font-weight:600;text-align:center;
  background:var(--cream);color:var(--ink)}
.answer-input:focus{outline:none;background:white;box-shadow:0 0 0 4px var(--sun)}
.unit-label{font-size:20px;font-weight:600;color:var(--plum)}
.submit-btn{width:100%;background:var(--coral);color:white;border:3px solid var(--ink);
  border-radius:18px;padding:14px;font-family:'Fredoka',sans-serif;font-weight:600;
  font-size:18px;cursor:pointer;box-shadow:0 4px 0 var(--ink);margin-top:10px}
.submit-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.feedback{text-align:center;padding:14px;border-radius:16px;margin-top:12px;
  font-size:16px;font-weight:600;animation:pop .3s ease-out}
.feedback.ok{background:var(--mint);color:white;border:3px solid var(--ink)}
.feedback.no{background:#FFE0E0;color:var(--coral);border:3px solid var(--coral)}
.hint{margin-top:8px;font-size:13px;background:white;color:var(--ink);
  padding:8px;border-radius:10px;font-weight:500}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* ── COMPARE ── */
.compare-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:10px 0}
.cmp-item{background:var(--cream);border:3px solid var(--ink);border-radius:16px;
  padding:14px 8px;text-align:center;cursor:pointer}
.cmp-item:active{transform:scale(.96)}
.cmp-item.picked{background:var(--mint);color:white}
.cmp-emoji{font-size:36px;display:block;margin-bottom:4px}
.cmp-weight{font-weight:600;font-size:15px}
.vs{font-family:'Caveat',cursive;font-size:28px;color:var(--coral);font-weight:700}

/* ── ITEM ── */
.item-display{text-align:center;margin:6px 0}
.item-emoji{font-size:60px;display:inline-block;animation:bob 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.item-name{font-size:15px;font-weight:600;color:var(--plum);margin-top:2px}
.scale-wrap{display:flex;justify-content:center;margin:8px 0;height:118px}
.visual-card{background:linear-gradient(135deg,#fffdf5,#eef7ff);border:3px solid var(--ink);
  border-radius:20px;padding:12px;margin:2px 0 12px;box-shadow:0 3px 0 var(--ink);
  overflow:hidden}
.visual-title{text-align:center;font-size:12px;font-weight:700;color:var(--plum);margin-bottom:8px}
.visual-row{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.visual-choice{background:white;border:2px solid var(--ink);border-radius:16px;padding:10px 12px;
  min-width:92px;text-align:center}
.visual-emoji{font-size:34px;display:block;line-height:1}
.visual-label{font-size:12px;font-weight:700;color:var(--plum);margin-top:4px}
.visual-balance{position:relative;height:112px;margin:0 auto;max-width:320px}
.visual-beam{position:absolute;left:44px;right:44px;top:44px;height:8px;background:var(--ink);border-radius:8px}
.visual-stand{position:absolute;left:50%;top:48px;width:12px;height:46px;background:var(--ink);border-radius:8px;transform:translateX(-50%)}
.visual-base{position:absolute;left:50%;bottom:6px;width:72px;height:10px;background:var(--ink);border-radius:12px;transform:translateX(-50%)}
.visual-pan{position:absolute;top:58px;width:104px;background:white;border:3px solid var(--ink);
  border-radius:18px;padding:9px 8px;text-align:center;box-shadow:0 3px 0 rgba(45,45,45,.2)}
.visual-pan.left{left:4px}.visual-pan.right{right:4px}
.visual-pan:before{content:'';position:absolute;left:50%;top:-18px;width:3px;height:18px;background:var(--ink)}
.visual-ruler{height:62px;background:#FFEAA7;border:3px solid var(--ink);border-radius:12px;
  display:flex;align-items:flex-end;justify-content:space-around;padding:0 8px 8px}
.visual-tick{width:3px;background:var(--ink);border-radius:3px}
.visual-tick.big{height:34px}.visual-tick.mid{height:24px}.visual-tick.small{height:14px}
.visual-money{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.coin,.note{display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--ink);
  font-weight:700;color:var(--ink)}
.coin{width:40px;height:40px;border-radius:50%;background:var(--sun);font-size:11px}
.note{width:66px;height:34px;border-radius:8px;background:var(--mint);font-size:12px}
.visual-clock{width:96px;height:96px;border:5px solid var(--ink);border-radius:50%;background:white;
  position:relative;margin:0 auto}
.visual-clock:before{content:'';position:absolute;left:50%;top:50%;width:8px;height:8px;background:var(--coral);
  border-radius:50%;transform:translate(-50%,-50%);z-index:2}
.clock-hand{position:absolute;left:50%;top:50%;height:35px;width:4px;background:var(--plum);
  transform-origin:50% 100%;border-radius:4px}
.clock-hand.min{height:40px;background:var(--sky)}
.clock-num{position:absolute;font-size:10px;font-weight:700;color:var(--ink)}
.clock-num.n12{top:5px;left:50%;transform:translateX(-50%)}.clock-num.n3{right:8px;top:50%;transform:translateY(-50%)}
.clock-num.n6{bottom:5px;left:50%;transform:translateX(-50%)}.clock-num.n9{left:8px;top:50%;transform:translateY(-50%)}
.visual-bars{height:96px;display:flex;align-items:flex-end;justify-content:center;gap:10px}
.visual-bar{width:34px;background:var(--sky);border:3px solid var(--ink);border-radius:10px 10px 4px 4px;
  display:flex;align-items:flex-start;justify-content:center;font-size:11px;font-weight:700;color:white;padding-top:4px}
.visual-fraction{display:grid;grid-template-columns:repeat(4,34px);gap:5px;justify-content:center}
.frac-cell{height:28px;border:2px solid var(--ink);border-radius:7px;background:white}
.frac-cell.fill{background:var(--sun)}
.visual-grid{display:grid;grid-template-columns:repeat(6,22px);gap:3px;justify-content:center}
.grid-cell{height:22px;border:2px solid rgba(45,45,45,.45);border-radius:4px;background:#E8F6FF}
.visual-angle svg,.visual-cuboid svg,.visual-road svg{width:180px;max-width:100%;display:block;margin:0 auto}

/* ── TEST MENU ── */
.test-grid{display:flex;flex-direction:column;gap:18px;margin-top:6px}
.test-level-block{display:flex;flex-direction:column;gap:10px}
.test-level-title{font-family:'Caveat',cursive;font-size:28px;font-weight:700;color:var(--plum);
  background:white;border:3px solid var(--ink);border-radius:18px;padding:8px 14px;box-shadow:0 3px 0 var(--ink)}
.test-card{background:white;border:4px solid var(--ink);border-radius:20px;
  padding:16px;cursor:pointer;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px}
.test-card:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.test-emoji{font-size:40px;flex-shrink:0}
.test-name{font-weight:700;font-size:18px}
.test-desc{font-size:12px;opacity:.65;margin-top:2px}
.test-meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tag{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;border:2px solid var(--ink)}
.tag.easy{background:#D4EDDA}.tag.medium{background:#FFF3CD}.tag.hard{background:#FFE0E0}

/* ── TEST ACTIVE ── */
.t-progress{margin-bottom:12px}
.t-bar{height:12px;background:#eee;border-radius:20px;border:2px solid var(--ink);overflow:hidden}
.t-bar-fill{height:100%;background:var(--mint);border-radius:20px;transition:width .4s}
.t-bar-label{display:flex;justify-content:space-between;font-size:12px;margin-top:4px;font-weight:600;opacity:.75}
.test-live-meta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}

/* ── TEST RESULTS ── */
.results-card{background:white;border:4px solid var(--ink);border-radius:24px;
  padding:22px 20px;text-align:center;box-shadow:var(--shadow);margin-bottom:16px}
.score-big{font-family:'Caveat',cursive;font-size:72px;font-weight:700;color:var(--plum);line-height:1}
.score-sub{font-size:15px;opacity:.7;margin-top:4px}
.res-emoji{font-size:58px;margin:10px 0}
	.res-msg{font-size:17px;font-weight:600;margin-bottom:8px}
	.breakdown{display:flex;gap:10px;justify-content:center;margin:10px 0}
	.chip{padding:8px 14px;border-radius:14px;font-size:14px;font-weight:600;border:2px solid var(--ink)}
	.chip.ok{background:var(--mint);color:white}.chip.no{background:var(--coral);color:white}
	.star-breakdown{margin-top:14px;background:var(--cream);border:2px solid var(--ink);
	  border-radius:16px;padding:12px;text-align:left}
	.star-break-title{font-weight:700;color:var(--plum);margin-bottom:5px;text-align:center}
	.star-formula{background:white;border:2px solid var(--ink);border-radius:12px;
	  padding:8px 10px;font-size:13px;font-weight:700;text-align:center;margin-bottom:10px}
	.star-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
	.star-part{background:white;border:1px solid rgba(45,45,45,.18);border-radius:12px;padding:8px}
	.star-label{font-size:11px;opacity:.6;font-weight:600}
	.star-value{font-size:17px;font-weight:700;color:var(--plum);margin-top:2px}
	.star-note{font-size:11px;opacity:.65;margin-top:2px}
	.act-row{display:flex;gap:10px;margin-top:10px}
	.act-btn{flex:1;padding:13px;border:3px solid var(--ink);border-radius:16px;
	  font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;cursor:pointer;
	  box-shadow:0 4px 0 var(--ink)}
.act-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.act-btn.primary{background:var(--mint);color:white}.act-btn.secondary{background:white}

/* ── SHARED REVIEW ── */
.rev-item{background:white;border:3px solid var(--ink);border-radius:18px;padding:14px;margin-bottom:10px}
.rev-item.ok{border-color:var(--mint)}.rev-item.no{border-color:var(--coral)}
.rev-q{font-size:15px;font-weight:500;margin-bottom:8px;line-height:1.4}
.rev-answers{display:flex;gap:8px;flex-wrap:wrap}
.rev-chip{padding:6px 12px;border-radius:10px;font-size:13px;font-weight:600;border:2px solid var(--ink)}
.rev-user.ok{background:#D4EDDA}.rev-user.no{background:#FFE0E0}.rev-correct{background:#D4EDDA}
.rev-hint{margin-top:6px;font-size:12px;opacity:.65;font-style:italic}
.rev-icon{float:right;font-size:20px}
.rev-qnum{font-size:11px;font-weight:700;opacity:.4;margin-bottom:4px}

/* ── PIN PAD ── */
.pin-wrap{text-align:center;padding:28px 20px 20px}
.pin-title{font-family:'Caveat',cursive;font-size:38px;color:var(--plum);margin-bottom:6px}
.pin-sub{font-size:14px;opacity:.6;margin-bottom:28px}
.pin-dots{display:flex;justify-content:center;gap:16px;margin-bottom:28px}
.pin-dot{width:22px;height:22px;border-radius:50%;border:3px solid var(--plum);
  background:white;transition:background .12s,border-color .12s}
.pin-dot.filled{background:var(--plum)}
.pin-dot.error{border-color:var(--coral)!important;background:var(--coral)!important}
.pin-dots.shake{animation:shake .5s ease}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:250px;margin:0 auto}
.pin-btn{background:white;border:3px solid var(--ink);border-radius:16px;
  padding:15px 8px;font-family:'Fredoka',sans-serif;font-size:24px;font-weight:600;
  cursor:pointer;box-shadow:0 4px 0 var(--ink);min-height:58px}
.pin-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.pin-btn.del{background:#FFF0EE;font-size:20px}
.pin-btn.ghost{background:transparent;border:none;box-shadow:none;cursor:default;pointer-events:none}
.pin-hint{margin-top:20px;font-size:12px;opacity:.35}

/* ── TUTOR DASHBOARD ── */
.t-header{background:var(--plum);color:white;
  margin:-16px -16px 16px;padding:16px 16px 20px;
  border-radius:0 0 28px 28px;border-bottom:4px solid #4D2C5E}
.t-hdr-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.t-hdr-title{font-family:'Caveat',cursive;font-size:30px;font-weight:700}
.t-hdr-left{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.t-student-label{font-size:11px;opacity:.85;font-weight:600}
.t-student-select{min-width:140px;max-width:220px;border:2px solid rgba(255,255,255,.45);
  border-radius:10px;background:rgba(255,255,255,.2);color:white;padding:6px 10px;
  font-family:'Fredoka',sans-serif;font-size:13px;font-weight:600}
.t-student-select option{color:var(--ink)}
.t-logout{background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);
  color:white;border-radius:12px;padding:6px 14px;
  font-family:'Fredoka',sans-serif;font-size:13px;cursor:pointer}
.t-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.t-stat{background:rgba(255,255,255,.15);border-radius:14px;padding:10px;text-align:center}
.t-stat-n{font-size:26px;font-weight:700;font-family:'Caveat',cursive;line-height:1.1}
.t-stat-l{font-size:11px;opacity:.85;margin-top:2px}
.t-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.t-tab{background:white;border:3px solid var(--ink);border-radius:14px;padding:10px 4px;
  font-family:'Fredoka',sans-serif;font-weight:600;font-size:13px;cursor:pointer;
  box-shadow:0 3px 0 var(--ink);text-align:center}
.t-tab.active{background:var(--plum);color:white;box-shadow:0 3px 0 #4D2C5E}
.t-tab:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}

/* Tutor session rows */
.sess-item{background:white;border:2px solid var(--ink);border-radius:14px;
  padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start}
.sess-type{font-weight:600;font-size:14px}
.sess-type.practice{color:var(--mint)}.sess-type.test{color:var(--coral)}.sess-type.assessment{color:var(--sky)}
.sess-date{font-size:11px;opacity:.55;margin-top:2px}
.sess-extra{font-size:11px;color:var(--plum);margin-top:2px;font-weight:500}
.sess-right{text-align:right;flex-shrink:0;margin-left:8px}
.sess-dur{font-weight:600;font-size:13px;color:var(--plum)}
.sess-score{font-size:11px;opacity:.7;margin-top:2px}
.no-data{text-align:center;opacity:.4;padding:24px;font-size:14px}

/* Tutor attempt rows */
.att-item{background:white;border:3px solid var(--ink);border-radius:16px;
  padding:12px 14px;margin-bottom:10px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.att-item:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.att-row1{display:flex;justify-content:space-between;align-items:center}
.att-name{font-weight:700;font-size:16px}
.att-score{font-weight:700;font-size:16px;color:var(--plum)}
	.att-row2{display:flex;justify-content:space-between;margin-top:5px;font-size:12px;opacity:.65}
	.att-view{color:var(--sky);font-weight:600}
	.star-mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:11px;font-weight:600}
	.star-mini span{background:var(--cream);border:1px solid rgba(45,45,45,.18);
	  border-radius:10px;padding:4px 7px}
	.student-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;cursor:default}
	.student-open{background:transparent;border:0;padding:0;text-align:left;font-family:'Fredoka',sans-serif;
	  color:var(--ink);cursor:pointer;min-width:0}
	.student-delete{background:#FFE0E0;border:2px solid var(--coral);border-radius:12px;color:var(--coral);
	  font-family:'Fredoka',sans-serif;font-weight:700;font-size:12px;padding:8px 10px;cursor:pointer}
	.student-delete:active{transform:translateY(1px)}
	.score-bar{height:7px;background:#eee;border-radius:10px;margin-top:7px;
	  border:1px solid #ddd;overflow:hidden}
.score-fill{height:100%;border-radius:10px;transition:width .3s}

/* Tutor settings */
.set-card{background:white;border:3px solid var(--ink);border-radius:16px;padding:16px;margin-bottom:12px}
.set-label{font-weight:700;font-size:14px;margin-bottom:6px;color:var(--plum)}
.set-sub{font-size:13px;opacity:.65;margin-bottom:10px}
.set-input{width:100%;padding:10px;border:2px solid var(--ink);border-radius:12px;
  font-family:'Fredoka',sans-serif;font-size:20px;text-align:center;letter-spacing:8px;background:var(--cream)}
.set-input:focus{outline:none;background:white;box-shadow:0 0 0 3px var(--sun)}
.set-input.compact{font-size:15px;letter-spacing:0;text-align:left}
.sync-status{font-size:12px;opacity:.75;margin:8px 0 0}
.sync-status.ok{color:var(--mint)}.sync-status.warn{color:var(--coral)}
.danger-btn{background:#FFE0E0;border:3px solid var(--coral);color:var(--coral);
  border-radius:14px;padding:12px;width:100%;font-family:'Fredoka',sans-serif;
  font-weight:600;font-size:15px;cursor:pointer;box-shadow:0 4px 0 #cc4444}
.danger-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #cc4444}

/* ── CELEBRATION ── */
.celebrate{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:110px;pointer-events:none;z-index:100;animation:cel 1.2s ease-out forwards}
@keyframes cel{0%{transform:translate(-50%,-50%) scale(0) rotate(-20deg);opacity:0}
  50%{transform:translate(-50%,-50%) scale(1.4) rotate(10deg);opacity:1}
  100%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:0}}

function cloneQuestionForAssessment(question,id,topicName){
  const q=JSON.parse(JSON.stringify(question));
  q.id=id;
  q.text=`<span class="highlight">${topicName}</span><br>${q.text}`;
  return q;
}
function buildSummativeQuestions(level){
  const tests=TESTS.filter(t=>Number(t.level||1)===level);
  return tests.flatMap((test,testIndex)=>{
    const topic=String(test.name||'Topic').replace(/^P\d+\s*/,'');
    const picks=[test.questions[0],test.questions[Math.min(5,test.questions.length-1)]].filter(Boolean);
    return picks.map((q,questionIndex)=>
      cloneQuestionForAssessment(q,`sum_p${level}_${testIndex+1}_${questionIndex+1}`,topic)
    );
  });
}

function testsForPracticeLevel(level){
  const lvl=Number(level)||1;
  return TESTS.filter(t=>Number(t.level||1)===lvl);
}
function shortTopicName(test){
  return String(test?.name||'Topic').replace(/^P\d+\s*/,'');
}
function practiceTopicOptions(level){
  const tests=testsForPracticeLevel(level);
  return [
    {id:'mix',emoji:'🎲',name:'Mixed'},
    ...tests.map(t=>({id:t.id,emoji:t.emoji||'📝',name:shortTopicName(t)}))
  ];
}
function practiceDifficultyOptions(){
  return[
    {id:'easy',emoji:'🌱',name:'Easy'},
    {id:'medium',emoji:'🧠',name:'Medium'},
    {id:'hard',emoji:'🔥',name:'Hard'},
  ];
}
function normalizePracticeMode(level,mode){
  const ids=new Set(practiceTopicOptions(level).map(x=>x.id));
  return ids.has(mode)?mode:'mix';
}
function normalizePracticeDifficulty(difficulty){
  return practiceDifficultyOptions().some(x=>x.id===difficulty)?difficulty:'easy';
}
function matchesPracticeDifficulty(index,total,difficulty){
  const last=Math.max(1,total-1);
  const ratio=index/last;
  if(difficulty==='hard')return ratio>=0.55;
  if(difficulty==='medium')return ratio>=0.25&&ratio<=0.75;
  return ratio<=0.45;
}
function practiceQuestionPool(){
  const p=APP.practice;
  p.mode=normalizePracticeMode(p.level,p.mode);
  p.difficulty=normalizePracticeDifficulty(p.difficulty);
  const tests=p.mode==='mix'
    ?testsForPracticeLevel(p.level)
    :TESTS.filter(t=>t.id===p.mode);
  const rows=tests.flatMap(t=>{
    const questions=t.questions||[];
    return questions
      .map((q,index)=>({...q,practiceTopic:t.name,practiceDifficulty:p.difficulty,practiceIndex:index}))
      .filter(q=>matchesPracticeDifficulty(q.practiceIndex,questions.length,p.difficulty));
  });
  return rows.length?rows:tests.flatMap(t=>(t.questions||[]).map((q,index)=>({
    ...q,practiceTopic:t.name,practiceDifficulty:p.difficulty,practiceIndex:index
  })));
}
function genPracticeQuestion(){
  const pool=practiceQuestionPool();
  const q=JSON.parse(JSON.stringify(pick(pool.length?pool:TESTS.flatMap(t=>t.questions))));
  q.practiceTopic=q.practiceTopic||'Practice';
  q.practiceDifficulty=normalizePracticeDifficulty(q.practiceDifficulty||APP.practice.difficulty);
  q.visual=inferPracticeVisual(q);
  return q;
}

function parseMassToGrams(text){
  const m=String(text||'').match(/(\d+(?:\.\d+)?)\s*(kilograms?|kg|grams?|g)\b/i);
  if(!m)return null;

function inferPracticeVisual(q){
  const plain=stripQuestionHtml(q.text).toLowerCase();
  const topic=String(q.practiceTopic||'').toLowerCase();
  const unit=String(q.unit||'').toLowerCase();
  const joined=`${plain} ${topic} ${unit}`;
  if(q.type==='compare'){
    const labelA=q.optA?.label||'A',labelB=q.optB?.label||'B';
    const massA=parseMassToGrams(labelA),massB=parseMassToGrams(labelB);
    const isMass=joined.includes('heavier')||joined.includes('mass')||joined.includes('weight')||massA!=null||massB!=null;
    return{
      type:isMass?'compare-scale':'compare',
      title:isMass?'Picture the two objects on a balance scale':'Compare the two choices',
      left:{emoji:q.optA?.emoji||'A',label:labelA},
      right:{emoji:q.optB?.emoji||'B',label:labelB}
    };
  }
  if(joined.includes('speed')||joined.includes('rate')||joined.includes('km/h')||joined.includes('m/s'))return{type:'road',title:'Distance, speed and time are connected'};
  if(joined.includes('ratio')||/\d+\s*:\s*\d+/.test(plain))return{type:'ratio',title:'Each dot shows one ratio part'};
  if(joined.includes('algebra')||/\b[xyabp]\b/.test(plain)&&/[=+\-]/.test(plain))return{type:'algebra',title:'Keep both sides balanced'};
  if(joined.includes('circle')||joined.includes('circumference')||joined.includes('radius')||joined.includes('diameter'))return{type:'circle',title:'Circle parts: radius, diameter and edge'};
  if(joined.includes('angle')||unit==='°')return{type:'angle',title:'Angles measure a turn'};
  if(joined.includes('volume')||unit.includes('cm³')||joined.includes('cuboid')||joined.includes('cube'))return{type:'cuboid',title:'Volume fills a 3D space'};
  if(joined.includes('area')||unit.includes('cm²'))return{type:'area',title:'Area counts the squares inside'};
  if(joined.includes('graph')||joined.includes('chart')||joined.includes('table')||joined.includes('votes')||joined.includes('average'))return{type:'graph',title:'Read the data carefully'};
  if(joined.includes('fraction')||/\d+\s*\/\s*\d+/.test(plain))return{type:'fraction',title:'Fractions show equal parts'};
  if(joined.includes('$')||joined.includes('cents')||joined.includes('dollars'))return{type:'money',title:'Use coins and notes to visualise money'};
  if(joined.includes('time')||joined.includes('hour')||joined.includes('minutes')||unit==='min'||unit==='h'||joined.includes('am')||joined.includes('pm'))return{type:'clock',title:'Use the clock to count time'};
  if(joined.includes('length')||unit==='cm'||unit==='m'||joined.includes('metres')||joined.includes('centimetres'))return{type:'ruler',title:'Use a ruler to compare lengths'};
  if(joined.includes('mass')||joined.includes('weight')||unit==='g'||unit==='kg'||joined.includes('grams')||joined.includes('kilograms')){
    const weightG=parseMassToGrams(q.text)||((unit==='kg'?Number(q.answer)*1000:unit==='g'?Number(q.answer):0)||1000);

  if(joined.includes('shape')||joined.includes('triangle')||joined.includes('rectangle')||joined.includes('square')||joined.includes('sphere')||joined.includes('cone'))return{type:'shapes',title:'Look at sides, corners and faces'};
  return{type:'blocks',title:'Break the numbers into parts'};
}

function makeStorageAdapter(){
  const ext=window.storage;
  if(ext&&typeof ext.get==='function'&&typeof ext.set==='function'){
    return {
      async get(key){return ext.get(key);},
      async set(key,value){return ext.set(key,value);}
    };
  }
  let localOK=false;
  try{
    const probe='__alya_probe__';
    window.localStorage.setItem(probe,'1');
    window.localStorage.removeItem(probe);
    localOK=true;
  }catch{}
  if(localOK){
    return {
      async get(key){
        const value=window.localStorage.getItem(key);
        return value===null?null:{value};
      },
      async set(key,value){
        window.localStorage.setItem(key,value);
      }
    };
  }
  const mem=new Map();
  return {
    async get(key){return mem.has(key)?{value:mem.get(key)}:null;},
    async set(key,value){mem.set(key,value);}
  };
}

function difficultyStarMultiplier(difficulty){

}

}
function testStarWorth(test){
  const qCount=Math.max(1,Number(test?.questions?.length||1));
  const diffMul=difficultyStarMultiplier(test?.difficulty||'easy');
  return{
    base:Math.max(1,Math.round(qCount*diffMul)),
    max:Math.max(1,Math.round(qCount*4*diffMul)),
  };
}
function isAttemptBetter(candidate,current){
  const cScore=Math.max(0,Number(candidate?.score||0));
  const cTotal=Math.max(1,Number(candidate?.total||1));
  const rScore=Math.max(0,Number(current?.score||0));
  const rTotal=Math.max(1,Number(current?.total||1));
  const cRatio=cScore/cTotal;
  const rRatio=rScore/rTotal;
  if(Math.abs(cRatio-rRatio)>1e-9)return cRatio>rRatio;
  if(cScore!==rScore)return cScore>rScore;
  const cStars=calcAttemptStars(candidate);
  const rStars=calcAttemptStars(current);
  if(cStars!==rStars)return cStars>rStars;
  const cDur=Math.max(1,Number(candidate?.duration||1));
  const rDur=Math.max(1,Number(current?.duration||1));
  if(cDur!==rDur)return cDur<rDur;
  return (Date.parse(candidate?.date||'')||0)>(Date.parse(current?.date||'')||0);
}
function normalizeAttemptRecord(raw){
  const base=(raw&&typeof raw==='object')?raw:{};
  return{
    id:String(base.id||('a'+Date.now()+Math.floor(Math.random()*1000))),
    testId:String(base.testId||''),
    testName:String(base.testName||'Test'),
    difficulty:String(base.difficulty||testById(base.testId)?.difficulty||'easy'),
    date:base.date||new Date().toISOString(),
    duration:Math.max(1,Number(base.duration||0)),
    score:Math.max(0,Number(base.score||0)),
    total:Math.max(1,Number(base.total||1)),
    answers:Array.isArray(base.answers)?base.answers:[],
  };
}
function attemptHistoryEntries(attempt){
  if(Array.isArray(attempt?.history)&&attempt.history.length){
    return attempt.history
      .map(normalizeAttemptRecord)
      .sort((a,b)=>Date.parse(b?.date||0)-Date.parse(a?.date||0));
  }
  return[normalizeAttemptRecord(attempt)];
}
function attachHistory(bestAttempt,historyList){
  const best=normalizeAttemptRecord(bestAttempt);
  const seen=new Set();
  const merged=(Array.isArray(historyList)?historyList:[])
    .map(normalizeAttemptRecord)
    .sort((a,b)=>Date.parse(b?.date||0)-Date.parse(a?.date||0))
    .filter(item=>{
      const key=String(item.id||'');
      if(!key)return true;
      if(seen.has(key))return false;
      seen.add(key);
      return true;
    });
  return{...best,history:merged.length?merged:[best]};
}
function upsertBestAttempt(attempt){
  const incoming=normalizeAttemptRecord(attempt);
  const idx=APP.testAttempts.findIndex(x=>String(x?.testId||'')===String(incoming?.testId||''));
  if(idx<0){
    APP.testAttempts.push(attachHistory(incoming,[incoming]));
    return{changed:true,replaced:false,historyAdded:true};
  }
  const current=APP.testAttempts[idx];
  const mergedHistory=[...attemptHistoryEntries(current),incoming]
    .sort((a,b)=>Date.parse(b?.date||0)-Date.parse(a?.date||0));
  if(isAttemptBetter(incoming,current)){
    APP.testAttempts[idx]=attachHistory(incoming,mergedHistory);
    return{changed:true,replaced:true,historyAdded:true};
  }
  APP.testAttempts[idx]=attachHistory(current,mergedHistory);
  return{changed:true,replaced:false,historyAdded:true,keptBest:true};
}
function selectBestAttempts(attempts){
  const grouped=new Map();
  for(const raw of (Array.isArray(attempts)?attempts:[])){
    const normalized=normalizeAttemptRecord(raw);
    const key=String(
      normalized.testId
      ||normalized.testName
      ||normalized.id
      ||`unknown-${Date.parse(normalized?.date||'')||0}-${Number(normalized?.score||0)}-${Number(normalized?.duration||0)}`
    );
    const incomingHistory=attemptHistoryEntries(raw);
    if(!grouped.has(key)){
      grouped.set(key,attachHistory(normalized,incomingHistory));
      continue;
    }
    const current=grouped.get(key);
    const mergedHistory=[...attemptHistoryEntries(current),...incomingHistory]
      .sort((a,b)=>Date.parse(b?.date||0)-Date.parse(a?.date||0));
    const best=isAttemptBetter(normalized,current)?normalized:current;
    grouped.set(key,attachHistory(best,mergedHistory));
  }
  return Array.from(grouped.values()).sort((a,b)=>
    Date.parse(b?.date||0)-Date.parse(a?.date||0)
  );
}

      const ts=Date.parse(entry?.date||'')||0;
      const attemptRef=[
        encodeURIComponent(String(entry.testId||best.testId||'')),
        encodeURIComponent(String(entry.id||'')),
        String(ts),
        String(index)
      ].join('|');
      rows.push({
        ...entry,
        attemptRef,
        isBest:String(entry.id||'')===String(best.id||''),
        attemptNo:index+1,
        attemptsForTest:history.length,
      });
    });
  });
  return rows.sort((a,b)=>{
    const tsDiff=(Date.parse(b?.date||'')||0)-(Date.parse(a?.date||'')||0);
    if(tsDiff!==0)return tsDiff;
    return Number(b?.score||0)-Number(a?.score||0);
  });
}
function attemptByRef(ref){
  if(!ref)return null;
  return allAttemptEntries(APP.testAttempts).find(x=>x.attemptRef===ref)||null;
}
function fmtMultiplier(n){
  const rounded=Math.round(Number(n||1)*100)/100;
  return `${rounded.toFixed(2).replace(/\.00$/,'').replace(/(\.\d)0$/,'$1')}x`;
}
function calcAttemptStarBreakdown(attempt){
  const score=Math.max(0,Number(attempt?.score||0));
  const total=Math.max(1,Number(attempt?.total||1));
  const duration=Math.max(1,Number(attempt?.duration||1));
  const expectedSec=total*45;
  const speedRatio=expectedSec/duration;
  // Faster than expected gets a stronger bonus curve, slower gets a gentle penalty.
  const fastBonus=Math.max(0,speedRatio-1);
  const timeMultiplier=speedRatio>=1
    ?Math.min(4,1+fastBonus*1.6)
    :Math.max(0.7,speedRatio);
  const difficultyMultiplier=attemptDifficultyMultiplier(attempt);
  const preciseStars=score*timeMultiplier*difficultyMultiplier;
  const roundedStars=Math.round(preciseStars);
  const totalStars=Math.max(1,roundedStars);
  const test=testById(String(attempt?.testId||''));
  const difficulty=String(attempt?.difficulty||test?.difficulty||'easy');
  return{
    score,total,duration,expectedSec,
    rawStars:score,
    timeMultiplier,
    difficultyMultiplier,
    difficulty,
    preciseStars,
    roundedStars,
    totalStars,
    minimumApplied:totalStars!==roundedStars,
  };
}
function calcAttemptStars(attempt){
  return calcAttemptStarBreakdown(attempt).totalStars;
}
function renderStarBreakdown(attempt,{compact=false}={}){
  const b=calcAttemptStarBreakdown(attempt);
  const diffLabel=cap(String(b.difficulty||'easy'));
  const formula=`${b.rawStars} raw ${b.rawStars===1?'star':'stars'} × ${fmtMultiplier(b.timeMultiplier)} speed × ${fmtMultiplier(b.difficultyMultiplier)} difficulty = ${b.totalStars} stars`;
  const minimumNote=b.minimumApplied?'Minimum 1 star applied':'Rounded to nearest star';
  if(compact){
    return `<div class="star-mini">
      <span>Raw ${b.rawStars} ⭐</span>
      <span>Speed ${fmtMultiplier(b.timeMultiplier)}</span>
      <span>${diffLabel} ${fmtMultiplier(b.difficultyMultiplier)}</span>
      <span>Total ${b.totalStars} ⭐</span>
    </div>`;
  }
  return `
    <div class="star-breakdown">
      <div class="star-break-title">⭐ Star Breakdown</div>
      <div class="star-formula">${formula}</div>
      <div class="star-grid">
        <div class="star-part">
          <div class="star-label">Raw score</div>
          <div class="star-value">${b.rawStars} ⭐</div>
          <div class="star-note">${b.score}/${b.total} correct</div>
        </div>
        <div class="star-part">
          <div class="star-label">Speed multiplier</div>
          <div class="star-value">${fmtMultiplier(b.timeMultiplier)}</div>
          <div class="star-note">${fmtDur(b.duration)} vs ${fmtDur(b.expectedSec)} target</div>
        </div>
        <div class="star-part">
          <div class="star-label">Difficulty multiplier</div>
          <div class="star-value">${fmtMultiplier(b.difficultyMultiplier)}</div>
          <div class="star-note">${diffLabel} quiz</div>
        </div>
        <div class="star-part">
          <div class="star-label">Final stars</div>
          <div class="star-value">${b.totalStars} ⭐</div>
          <div class="star-note">${minimumNote}</div>
        </div>
      </div>
    </div>`;
}
function computeLeaderboardRow(studentName,attempts){
  const safeAttempts=selectBestAttempts(attempts);
  const testDetails=safeAttempts.map(a=>{
    const breakdown=calcAttemptStarBreakdown(a);
    return{
      testId:a.testId||'',
      testName:a.testName||'Test',
      difficulty:a.difficulty||testById(String(a.testId||''))?.difficulty||'easy',
      score:Number(a.score||0),
      total:Number(a.total||0),
      duration:Math.max(1,Number(a.duration||0)),
      stars:breakdown.totalStars,
      rawStars:breakdown.rawStars,
      timeMultiplier:breakdown.timeMultiplier,
      difficultyMultiplier:breakdown.difficultyMultiplier,
      date:a.date||new Date().toISOString()
    };
  });
  const totalStars=testDetails.reduce((sum,t)=>sum+(Number(t.stars)||0),0);
  return{
    studentName:studentName||'Student',
    testsCompleted:testDetails.length,
    totalStars,
    tests:testDetails
  };
}
async function parseCloudHttpError(res){
  let detail='';
  try{
    const raw=await res.text();
    if(raw){
      try{
        const j=JSON.parse(raw);
        detail=j?.message||j?.error_description||j?.details||j?.hint||raw;
      }catch{
        detail=raw;
      }
    }
  }catch{}
  const clean=String(detail||'').replace(/\s+/g,' ').trim().slice(0,120);
  return clean?`HTTP ${res.status}: ${clean}`:`HTTP ${res.status}`;
}
function shortCloudError(err){
  const msg=String(err||'error').replace(/\s+/g,' ').trim();
  if(!msg)return'error';
  return msg.length>80?msg.slice(0,77)+'...':msg;
}
function sortedUniqueStudentNames(){
  const seen=new Set();
  const names=[];
  const add=raw=>{
    const name=normalizeStudentName(raw);
    if(!name)return;
    const key=name.toLowerCase();
    if(seen.has(key))return;
    seen.add(key);
    names.push(name);
  };
  add(APP.studentName);
  (APP.studentDirectory||[]).forEach(row=>add(row?.studentName));
  (APP.leaderboard||[]).forEach(row=>add(row?.studentName));
  return names.sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:'base'}));
}

async function cloudPull(){
  if(!ensureStudentContext())return{ok:false,error:'no-student'};
  if(!cloudConfigured())return{ok:false,error:'disabled'};
  const studentId=sanitizeStudentId(APP.cloudStudentId);
  APP.cloudStudentId=studentId;
  const selects=[
    'student_name,sessions,attempts,tutor_pin,updated_at',
    'sessions,attempts,tutor_pin,updated_at',
    'sessions,attempts,updated_at',
  ];
  try{
    let lastError='query failed';
    for(const select of selects){
      const url=`${cloudBaseUrl()}/${CLOUD_SYNC.table}?student_id=eq.${encodeURIComponent(studentId)}&select=${select}&limit=1`;
      const res=await fetchWithTimeout(url,{headers:cloudHeaders({Accept:'application/json'})});
      if(!res.ok){
        lastError=await parseCloudHttpError(res);
        continue;
      }
      const rows=await res.json().catch(()=>[]);
      if(!Array.isArray(rows)||rows.length===0)return{ok:true,row:null};
      const row=rows[0];
      return{
        ok:true,
        row:{
          studentName:normalizeStudentName(row.student_name||APP.studentName||studentId),
          sessions:Array.isArray(row.sessions)?row.sessions.slice(-100):[],
          attempts:selectBestAttempts(row.attempts).slice(-200),
          tutorPin:/^\d{4}$/.test(row.tutor_pin||'')?row.tutor_pin:'1234',
          updatedAt:Date.parse(row.updated_at||'')||0
        }
      };
    }
    return{ok:false,error:lastError};
  }catch(err){
    return{ok:false,error:err?.name==='AbortError'?'timeout':(err?.message||'network error')};
  }
}
async function cloudPush(){
  if(!ensureStudentContext())return{ok:false,error:'no-student'};
  if(!cloudConfigured())return{ok:false,error:'disabled'};
  const studentId=sanitizeStudentId(APP.cloudStudentId);
  APP.cloudStudentId=studentId;
  APP.studentName=normalizeStudentName(APP.studentName)||studentId;
  const basePayload={
    student_id:studentId,
    sessions:(APP.sessions||[]).slice(-100),
    attempts:(APP.testAttempts||[]).slice(-200),
    updated_at:new Date().toISOString(),
  };
  const payloads=[
    [{...basePayload,student_name:APP.studentName,tutor_pin:APP.tutorPin}],
    [{...basePayload,tutor_pin:APP.tutorPin}],
    [basePayload],
  ];
  const url=`${cloudBaseUrl()}/${CLOUD_SYNC.table}?on_conflict=student_id`;
  try{
    let lastError='upsert failed';
    for(const payload of payloads){
      const res=await fetchWithTimeout(url,{
        method:'POST',
        headers:cloudHeaders({
          'Content-Type':'application/json',
          'Prefer':'resolution=merge-duplicates,return=representation'
        }),
        body:JSON.stringify(payload)
      });
      if(!res.ok){
        lastError=await parseCloudHttpError(res);
        continue;
      }
      const rows=await res.json().catch(()=>[]);
      const updatedAt=Date.parse(rows?.[0]?.updated_at||'')||Date.now();
      APP.cloudLastSync=updatedAt;
      await setLocalUpdated(updatedAt);
      return{ok:true,updatedAt};
    }
    return{ok:false,error:lastError};
  }catch(err){
    return{ok:false,error:err?.name==='AbortError'?'timeout':(err?.message||'network error')};
  }
}

async function syncCloudOnLoad(){
  if(!ensureStudentContext())return;
  if(!cloudConfigured()){
    APP.cloudStatus='Local only (cloud not configured)';
    return;
  }
  APP.cloudStatus='Cloud connecting...';
  const pulled=await cloudPull();
  if(!pulled.ok){
    APP.cloudStatus=`Cloud error: ${shortCloudError(pulled.error)} (using local)`;
    return;
  }
  if(!pulled.row){
    // Always create a cloud row so tutor can see registered students
    // even if they have not attempted any test yet.
    const pushed=await cloudPush();
    APP.cloudStatus=pushed.ok
      ?'Cloud synced'
      :`Cloud error: ${shortCloudError(pushed.error)} (using local)`;
    return;
  }
  const remoteTs=pulled.row.updatedAt||0;
  if(remoteTs>=LOCAL_UPDATED_AT){
    APP.studentName=normalizeStudentName(pulled.row.studentName||APP.studentName);
    APP.sessions=pulled.row.sessions;
    APP.testAttempts=pulled.row.attempts;
    APP.tutorPin=pulled.row.tutorPin;
    APP.cloudLastSync=remoteTs||Date.now();
    await persistLocalSnapshot();
    await setLocalUpdated(remoteTs||Date.now());
    APP.cloudStatus='Cloud synced';
  }else{
    const pushed=await cloudPush();
    APP.cloudStatus=pushed.ok
      ?'Cloud synced'
      :`Cloud error: ${shortCloudError(pushed.error)} (using local)`;
  }
}
async function syncCloudNow(){
  if(!ensureStudentContext())return false;
  if(!cloudConfigured()){APP.cloudStatus='Local only (cloud not configured)';return false;}
  APP.cloudStatus='Cloud syncing...';
  const pulled=await cloudPull();
  if(!pulled.ok){APP.cloudStatus=`Cloud error: ${shortCloudError(pulled.error)} (sync failed)`;return false;}
  if(pulled.row){
    APP.studentName=normalizeStudentName(pulled.row.studentName||APP.studentName);
    APP.sessions=pulled.row.sessions;
    APP.testAttempts=pulled.row.attempts;
    APP.tutorPin=pulled.row.tutorPin;
    APP.cloudLastSync=pulled.row.updatedAt||Date.now();
  }
  await persistLocalSnapshot();
  const pushed=await cloudPush();

    ?'Cloud synced'
    :`Cloud error: ${shortCloudError(pushed.error)} (sync failed)`;
  return pushed.ok;
}

async function fetchLeaderboard(){
  const localFallback=APP.studentName
    ?[computeLeaderboardRow(APP.studentName,APP.testAttempts)]
    :[];
  const clearCutoff=Number(APP.cloudClearCutoff||0);
  if(!cloudConfigured()){
    APP.leaderboard=localFallback;
    return APP.leaderboard.length>0;
  }
  try{
    let rows=await fetchLeaderboardRows('student_id,student_name,attempts,updated_at',true);
    if(rows===null)rows=await fetchLeaderboardRows('student_id,attempts,updated_at',true);
    if(rows===null)rows=await fetchLeaderboardRows('student_id,student_name,attempts',false);
    if(rows===null)rows=await fetchLeaderboardRows('student_id,attempts',false);
    if(rows===null){
      APP.leaderboard=localFallback;
      return APP.leaderboard.length>0;
    }
    APP.leaderboard=rows
      .map(row=>({
        name:normalizeStudentName(row.student_name||row.student_id||'Student'),
        attempts:Array.isArray(row.attempts)?row.attempts:[],
        updatedAt:Date.parse(row.updated_at||'')||0,
        latestAttemptAt:(Array.isArray(row.attempts)?row.attempts:[])
          .reduce((maxTs,a)=>Math.max(maxTs,Date.parse(a?.date||'')||0),0)
      }))
      .filter(item=>!clearCutoff||item.latestAttemptAt>clearCutoff)
      .map(item=>computeLeaderboardRow(item.name,item.attempts))
      .filter(row=>row.testsCompleted>0||row.totalStars>0)
      .sort((a,b)=>b.totalStars-a.totalStars||b.testsCompleted-a.testsCompleted||a.studentName.localeCompare(b.studentName));
    if(APP.leaderboard.length===0&&localFallback.length)APP.leaderboard=localFallback;
    return true;
  }catch{
    APP.leaderboard=localFallback;
    return APP.leaderboard.length>0;
  }
}

async function deleteStudentByName(rawName){
  const name=normalizeStudentName(rawName);
  if(name.length<2)return{ok:false,error:'invalid student'};
  const studentId=sanitizeStudentId(name);
  const currentId=sanitizeStudentId(APP.cloudStudentId||APP.studentName);
  const isCurrent=studentId===currentId
    ||name.toLowerCase()===normalizeStudentName(APP.studentName).toLowerCase();

  if(cloudConfigured()){
    const deleted=await cloudDeleteStudentsByIds([studentId]);
    if(!deleted.ok)return deleted;
  }

  await clearLocalSnapshotForStudent(studentId);
  APP.studentDirectory=(APP.studentDirectory||[])
    .filter(row=>sanitizeStudentId(row?.studentName)!==studentId);
  APP.leaderboard=(APP.leaderboard||[])
    .filter(row=>sanitizeStudentId(row?.studentName)!==studentId);

  if(isCurrent){
    APP.sessions=[];
    APP.testAttempts=[];
    APP.selectedAttempt=null;
    APP.selectedAttemptSource='tutor';
    APP.studentName='';
    APP.cloudStudentId='';
    APP.cloudLastSync=0;
    LOCAL_UPDATED_AT=0;
    try{await storage.set(KEY_LAST_STUDENT,'');}catch{}
  }

  APP.cloudStatus=cloudConfigured()?'Cloud synced':'Local student deleted';
  if(cloudConfigured()){
    await Promise.allSettled([fetchLeaderboard(),fetchStudentDirectory()]);
  }
  return{ok:true};
}

    if(r?.value)APP.tutorPin=r.value;
  }catch{}
  await loadCloudClearCutoff();
  try{
    const r=await storage.get(KEY_LAST_STUDENT);
    const last=normalizeStudentName(r?.value||'');
    if(last)APP.studentName=last;
  }catch{
    APP.studentName='';
  }
  APP.screen='student_login';
}
async function saveSessions(){
  if(!ensureStudentContext())return;
  await persistLocalSnapshot();
  await setLocalUpdated(Date.now());
  const pushed=await cloudPush();
  if(cloudConfigured()&&!pushed.ok)APP.cloudStatus='Cloud error (save pending)';
}
async function appendAttempt(a){
  if(!ensureStudentContext())return{saved:false,reason:'no-student'};
  a.stars=calcAttemptStars(a);
  const upd=upsertBestAttempt(a);
  if(!upd.changed)return{saved:false,reason:'kept-best'};
  await persistLocalSnapshot();
  await setLocalUpdated(Date.now());
  const pushed=await cloudPush();
  if(cloudConfigured()&&!pushed.ok)APP.cloudStatus='Cloud error (save pending)';
  return{saved:true,replaced:upd.replaced};
}
async function saveTutorPin(pin){
  APP.tutorPin=pin;
  try{await storage.set(KEY_PIN,pin);}catch{}
  if(ensureStudentContext()){
    await persistLocalSnapshot();
    await setLocalUpdated(Date.now());
    const pushed=await cloudPush();
    if(cloudConfigured()&&!pushed.ok)APP.cloudStatus='Cloud error (save pending)';
  }
}

function startSession(type){
  APP.sessionStart=Date.now();APP.sessionType=type;
  clearInterval(APP.timerTick);
  APP.timerTick=setInterval(()=>{
    const el=document.getElementById('sessTimer');
    if(el&&APP.sessionStart)el.textContent=fmtDur(Math.floor((Date.now()-APP.sessionStart)/1000));
  },1000);
}
async function endSession(extra={}){
  if(!APP.sessionStart)return;
  clearInterval(APP.timerTick);
  const dur=Math.floor((Date.now()-APP.sessionStart)/1000);
  APP.sessions.push({id:'s'+Date.now(),
    start:new Date(APP.sessionStart).toISOString(),
    end:new Date().toISOString(),
    duration:dur,type:APP.sessionType,...extra});
  APP.sessionStart=null;APP.sessionType=null;
  await saveSessions();
}

// ── Helpers ──
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=arr=>arr[ri(0,arr.length-1)];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function fmtDur(s){
  if(s<60)return s+'s';const m=Math.floor(s/60),r=s%60;
  if(m<60)return m+'m'+(r?' '+r+'s':'');
  return Math.floor(m/60)+'h '+(m%60)+'m';
}
function fmtDate(iso){
  const d=new Date(iso),df=Date.now()-d;
  if(df<60000)return 'Just now';
  if(df<3600000)return Math.floor(df/60000)+'m ago';
  if(df<86400000)return Math.floor(df/3600000)+'h ago';
  if(df<172800000)return 'Yesterday';
  return d.toLocaleDateString('en-SG',{day:'numeric',month:'short'})
    +' '+d.toLocaleTimeString('en-SG',{hour:'2-digit',minute:'2-digit'});
}

function genConvert(){
  const p=APP.practice,dir=Math.random()>.5?'k':'g';let from,fu,tu,ans;
  if(p.level===1){
    from=ri(1,10);
    if(dir==='k'){fu='kg';tu='g';ans=from*1000;}
    else{from*=1000;fu='g';tu='kg';ans=from/1000;}
  }else if(p.level===2){
    if(dir==='k'){from=pick([0.5,1.5,2.5,3.5,4.5,1.25,2.25,3.75]);fu='kg';tu='g';ans=from*1000;}
    else{from=pick([500,1500,2500,3500,4500,1250,2250,3750]);fu='g';tu='kg';ans=from/1000;}
  }else{
    if(dir==='k'){from=Math.round(ri(105,895))/100;fu='kg';tu='g';ans=Math.round(from*1000);}
    else{from=ri(1100,8950);fu='g';tu='kg';ans=from/1000;}
  }
  const wG=fu==='kg'?from*1000:from;
  return{type:'number',
    text:`How many <span class="highlight">${tu}</span> is <span class="highlight">${from} ${fu}</span>?`,
    answer:ans,unit:tu,tolerance:.01,scaleWeightG:wG,
    hint:fu==='kg'?`${from} × 1000 = ${ans} g`:`${from} ÷ 1000 = ${ans} kg`};
}
function genCompare(){
  const p=APP.practice;let aW,bW,aU,bU;
  if(p.level===1){aW=ri(1,9)*1000;aU='g';bW=ri(1,9);bU='kg';}
  else if(p.level===2){aW=pick([500,1500,2000,2500,3000,3500,4000]);aU='g';bW=ri(10,40)/10;bU='kg';}
  else{aW=ri(500,5500);aU='g';bW=ri(10,55)/10;bU='kg';}
  const aG=aU==='kg'?aW*1000:aW,bG=bU==='kg'?bW*1000:bW;
  return{type:'compare',
    text:'Which is <span class="highlight">heavier</span>? Tap to choose!',
    optA:{label:`${aW} ${aU}`,emoji:'📦',weightG:aG},
    optB:{label:`${bW} ${bU}`,emoji:'📦',weightG:bG},
    answer:aG>=bG?'A':'B',
    hint:`${aW} ${aU} = ${aG}g  vs  ${bW} ${bU} = ${bG}g`};
}
function genRealLife(){
  const p=APP.practice,item=pick(ITEMS);
  const g=item.unit==='kg'?item.weight*1000:item.weight;
  const v=ri(1,3);let text,ans,unit;
  if(v===1){
    if(item.unit==='g'){ans=g/1000;unit='kg';
      text=`${cap(item.name)} ≈ <span class="highlight">${item.weight} ${item.unit}</span>. How many <span class="highlight">kg</span>?`;}
    else{ans=g;unit='g';
      text=`${cap(item.name)} ≈ <span class="highlight">${item.weight} ${item.unit}</span>. How many <span class="highlight">g</span>?`;}
  }else if(v===2){
    const n=ri(2,5),tot=g*n;
    if(p.level>=2&&tot>=1000){ans=tot/1000;unit='kg';
      text=`${cap(item.name)} = <span class="highlight">${item.weight} ${item.unit}</span>. Weight of <span class="highlight">${n}</span> in <span class="highlight">kg</span>?`;}
    else{ans=tot;unit='g';
      text=`${cap(item.name)} = <span class="highlight">${item.weight} ${item.unit}</span>. Weight of <span class="highlight">${n}</span> in <span class="highlight">g</span>?`;}
  }else{
    const ex=ri(1,5);ans=(g+ex*1000)/1000;unit='kg';
    text=`${cap(item.name)} = <span class="highlight">${item.weight} ${item.unit}</span> + <span class="highlight">${ex} kg</span> bag. Total in <span class="highlight">kg</span>?`;
  }
  return{type:'number',text,answer:ans,unit,tolerance:.01,item,hint:`Answer: ${ans} ${unit}`};
}

// ================================================================
// ANSWER CHECKING
// ================================================================
function checkAns(q,raw){
  if(q.type==='number'){const v=parseFloat(raw);return isNaN(v)?null:Math.abs(v-q.answer)<=(q.tolerance||.01);}
  if(q.type==='compare')return raw===q.answer;
  return false;
}
function fmtAns(q){
  if(q.type==='number')return q.unit?`${q.answer} ${q.unit}`:String(q.answer);
  return q.answer==='A'?q.optA.label:q.optB.label;
}
function fmtUserAns(q,raw){
  if(q.type==='number')return q.unit?`${raw} ${q.unit}`:String(raw);
  return raw==='A'?q.optA.label:q.optB.label;
}

function submitPractice(raw){
  const p=APP.practice;if(p.answered)return;
  const ok=checkAns(p.currentQ,raw);
  if(ok===null){toast('Enter a number first!');return;}
  p.answered=true;
  p.history.push({q:p.currentQ,userAnswer:String(raw),correct:ok});
  if(ok)p.qNum++;
  const cor=p.history.filter(x=>x.correct).length;
  const bar=document.getElementById('revBar'),info=document.getElementById('revInfo');
  if(bar){bar.style.display='flex';if(info)info.textContent=`✅ ${cor}/${p.history.length} correct`;}
  const fb=document.getElementById('pFeed');if(!fb)return;
  const cheers=['Amazing! ⭐','Excellent! 🌟','You got it! 🎉','Brilliant! ✨','Perfect! 👏'];
  fb.innerHTML=ok
    ?`<div class="feedback ok">${pick(cheers)}</div>
      <button class="submit-btn" style="background:var(--mint);margin-top:10px" data-a="next-q">Next Question →</button>`
    :`<div class="feedback no">Not quite!</div>
      <div class="hint">💡 ${p.currentQ.hint||'Correct: '+fmtAns(p.currentQ)}</div>
      <button class="submit-btn" style="background:var(--sky);margin-top:10px" data-a="next-q">Try Another →</button>`;
  if(ok){const c=document.createElement('div');c.className='celebrate';
    c.textContent=pick(['🎉','⭐','🌟','🏆','✨']);document.body.appendChild(c);setTimeout(()=>c.remove(),1200);}
}

async function submitTest(raw){
  const t=APP.test,q=t.questions[t.current];
  const ok=checkAns(q,raw);
  if(ok===null){toast('Enter a number first!');return;}
  t.answers.push({idx:t.current,q,userAnswer:String(raw),correct:ok});
  if(t.current+1>=t.questions.length){
    // Build & persist detailed attempt record for tutor
    const obj=testById(t.id);
    const score=t.answers.filter(a=>a.correct).length;
    const attempt={
      id:'a'+Date.now(),
      testId:t.id,
      testName:obj?.name||'Test',
      difficulty:obj?.difficulty||'easy',
      date:new Date().toISOString(),
      duration:APP.sessionStart?Math.floor((Date.now()-APP.sessionStart)/1000):0,
      score,total:t.questions.length,
      answers:t.answers.map(a=>({
        qId:a.q.id,
        qText:a.q.text.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim(),
        qType:a.q.type,
        userAnswer:fmtUserAns(a.q,a.userAnswer),
        correct:a.correct,
        correctAnswer:fmtAns(a.q),
	        hint:a.q.hint||''
	      }))
	    };
	    APP.test.completedAttempt=attempt;
	    const saveResult=await appendAttempt(attempt);
    await endSession({testName:obj?.name||'Test',score:`${score}/${t.questions.length}`,testId:t.id});
    if(saveResult?.reason==='kept-best'){
      toast('Best score kept for this quiz');
    }else if(saveResult?.replaced){
      toast('Higher score replaced your previous result');
    }
    go('test_results');
  }else{
    t.current++;go('test_active');
  }
}

function buildScale(wG){
  let maxG,ticks;
  if(wG<=500){maxG=500;ticks=[0,100,200,300,400,500];}
  else if(wG<=1000){maxG=1000;ticks=[0,250,500,750,1000];}
  else if(wG<=2000){maxG=2000;ticks=[0,0.5,1,1.5,2];}
  else if(wG<=5000){maxG=5000;ticks=[0,1,2,3,4,5];}
  else if(wG<=10000){maxG=10000;ticks=[0,2,4,6,8,10];}
  else{maxG=20000;ticks=[0,5,10,15,20];}
  const ul=maxG>1000?'kg':'g',ratio=Math.min(wG/maxG,1),deg=-90+ratio*180;
  const reading=ul==='g'?wG+'g':(wG/1000)+'kg';
  const marks=ticks.map((t,i)=>{
    const a=-Math.PI+(i/(ticks.length-1))*Math.PI,cx=100,cy=88;
    const [x1,y1]=[cx+Math.cos(a)*66,cy+Math.sin(a)*66];
    const [x2,y2]=[cx+Math.cos(a)*57,cy+Math.sin(a)*57];
    const [xt,yt]=[cx+Math.cos(a)*47,cy+Math.sin(a)*47];
    return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#2D2D2D" stroke-width="1.5"/>
            <text x="${xt.toFixed(1)}" y="${(yt+3).toFixed(1)}" text-anchor="middle" font-size="8" font-family="Fredoka" fill="#6A4C93" font-weight="600">${t}</text>`;
  }).join('');
  return `<svg viewBox="0 0 200 115" style="width:190px;height:115px">
    <path d="M18 88 A82 82 0 0 1 182 88 Z" fill="#FFF8E7" stroke="#2D2D2D" stroke-width="2.5"/>
    ${marks}
    <text x="100" y="74" text-anchor="middle" font-size="9" font-family="Fredoka" fill="#6A4C93" font-weight="700">${ul}</text>
    <g style="transform:rotate(${deg}deg);transform-origin:100px 88px">
      <line x1="100" y1="88" x2="100" y2="26" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round"/>
      <circle cx="100" cy="88" r="7" fill="#2D2D2D"/>
      <circle cx="100" cy="88" r="3" fill="#FFD93D"/>
    </g>
    <rect x="38" y="88" width="124" height="19" fill="#6A4C93" stroke="#2D2D2D" stroke-width="2.5" rx="4"/>
    <rect x="56" y="107" width="88" height="6" fill="#4D2C5E" stroke="#2D2D2D" stroke-width="2" rx="2"/>
    <rect x="64" y="92" width="72" height="12" fill="#2D2D2D" rx="2"/>
    <text x="100" y="102" text-anchor="middle" font-size="10" font-family="Fredoka" fill="#FFD93D" font-weight="700">${reading}</text>
  </svg>`;
}

document.addEventListener('DOMContentLoaded',()=>{
  const app=document.getElementById('app');
  app.addEventListener('click',e=>{
    const el=e.target.closest('[data-a]');if(!el)return;
    if(el.tagName==='SELECT')return;
    handle(el.dataset.a,el.dataset.val??null);
  });
  app.addEventListener('change',e=>{
    const el=e.target.closest('[data-a]');if(!el)return;
    const value=('value' in el&&typeof el.value==='string')?el.value:(el.dataset.val??null);
    handle(el.dataset.a,value);
  });
  app.addEventListener('keypress',e=>{
    if(e.key!=='Enter')return;
    if(e.target.id==='qInput'){
      if(APP.screen==='practice')submitPractice(e.target.value);
      else if(APP.screen==='test_active')submitTest(e.target.value);
      return;
    }
    if(e.target.id==='studentNameInput'&&APP.screen==='student_login'){
      handle('student-login',null);
    }
  });
  loadAll().then(render);
});

function handle(a,v){
  switch(a){
    case 'student-login':{
      const inp=document.getElementById('studentNameInput');
      const name=normalizeStudentName(inp?.value||APP.studentName);
      loginStudent(name).then(ok=>{
        if(!ok){toast('Please enter at least 2 characters');return;}
        go('home');
      });
      break;
    }
    case 'logout-student':
      if(APP.sessionStart){
        const h=APP.practice.history||[];
        endSession({questionsAttempted:h.length,correctAnswers:h.filter(x=>x.correct).length}).then(()=>{
          logoutStudent();render();
        });
      }else{
        logoutStudent();render();
      }
      break;
    case 'go-leaderboard':
      fetchLeaderboard().then(ok=>{
        if(!ok&&cloudConfigured())toast('Could not refresh leaderboard now');
        go('leaderboard');
      });
      break;
    case 'refresh-leaderboard':
      fetchLeaderboard().then(ok=>{
        go('leaderboard');
        if(!ok)toast('Could not refresh leaderboard now');
      });
      break;
    case 'refresh-students':
      fetchStudentDirectory().then(ok=>{
        if(!ok)toast('Could not refresh student list now');
        go('tutor_dash');
      });
      break;
    case 'pick-student':{
      const name=normalizeStudentName(decodeURIComponent(v||''));
      if(name.length<2){toast('Invalid student name');break;}
      loadStudentByName(name).then(ok=>{
        if(!ok){toast('Could not load that student now');return;}
        APP.tutorTab='sessions';
        go('tutor_dash');
        toast(`Loaded ${name}`);
      });
      break;
    }
    case 'delete-student':{
      const name=normalizeStudentName(decodeURIComponent(v||''));
      if(name.length<2){toast('Invalid student name');break;}
      if(!confirm(`Delete ${name} and all their session/test history? This cannot be undone.`))break;
      APP.cloudStatus=cloudConfigured()?`Deleting ${name}...`:'Deleting local student...';
      APP.tutorTab='settings';
      go('tutor_dash');
      deleteStudentByName(name).then(result=>{
        if(!result.ok){
          APP.cloudStatus=`Cloud error: ${shortCloudError(result.error)} (delete failed)`;
          go('tutor_dash');
          toast('Could not delete student');
          return;
        }
        APP.tutorTab='settings';
        go('tutor_dash');
        toast(`Deleted ${name}`);
      }).catch(err=>{
        APP.cloudStatus=`Cloud error: ${shortCloudError(err?.message||err)} (delete failed)`;
        go('tutor_dash');
        toast('Could not delete student');
      });
      break;
    }
    case 'tutor-pick-student':{
      const name=normalizeStudentName(v||'');
      if(name.length<2||name===APP.studentName)break;
      const nextTab=APP.tutorTab==='tests'?'tests':'sessions';
      loadStudentByName(name).then(ok=>{
        if(!ok){toast('Could not load that student now');go('tutor_dash');return;}
        APP.tutorTab=nextTab;
        go('tutor_dash');
      });
      break;
    }

    // ── Student navigation ──────────────────────────────────────
    case 'go-practice':
      if(!APP.studentName){go('student_login');toast('Login with your name first');break;}
      APP.practice={mode:'mix',difficulty:'easy',level:1,qNum:1,currentQ:null,answered:false,history:[]};
      startSession('practice');go('practice');break;
    case 'go-test-menu':
      if(!APP.studentName){go('student_login');toast('Login with your name first');break;}
      go('test_menu');break;
    case 'go-assessment-menu':
      if(!APP.studentName){go('student_login');toast('Login with your name first');break;}
      go('assessment_menu');break;
    case 'go-test-history':
      if(!APP.studentName){go('student_login');toast('Login with your name first');break;}
      go('test_history');break;
    case 'set-level':
      APP.practice.level=parseInt(v)||1;
      APP.practice.mode='mix';
      APP.practice.qNum=1;
      go('practice');break;
    case 'set-difficulty':
      APP.practice.difficulty=normalizePracticeDifficulty(v);
      APP.practice.qNum=1;
      go('practice');break;
    case 'set-mode':
      APP.practice.mode=normalizePracticeMode(APP.practice.level,v);
      APP.practice.qNum=1;
      go('practice');break;
    case 'submit-ans':{
      const inp=document.getElementById('qInput');
      if(APP.screen==='practice')submitPractice(inp?.value);
      else if(APP.screen==='test_active')submitTest(inp?.value);break;
    }
    case 'pick-cmp':
      document.querySelectorAll('.cmp-item').forEach(x=>x.classList.remove('picked'));
      document.querySelector(`[data-a="pick-cmp"][data-val="${v}"]`)?.classList.add('picked');
      if(APP.screen==='practice')submitPractice(v);
      else if(APP.screen==='test_active')submitTest(v);break;
    case 'next-q':renderPracticeQ();break;
    case 'go-review-practice':
      APP.review={source:'practice',items:APP.practice.history,backTo:'practice'};go('review');break;
    case 'start-test':{
      if(!APP.studentName){go('student_login');toast('Login with your name first');break;}
      const t=testById(v);
      if(!t){toast('Quiz not found');break;}
      APP.test={id:v,questions:t.questions,current:0,answers:[],menu:t.assessmentType==='summative'?'assessment_menu':'test_menu'};
      startSession(t.assessmentType==='summative'?'assessment':'test');go('test_active');break;
    }
    case 'abandon-test':
      endSession({testId:APP.test.id,abandoned:true}).then(()=>go(APP.test.menu||'test_menu'));break;
    case 'retry-test':{
      const t=testById(APP.test.id);
      if(!t){toast('Quiz not found');go('home');break;}
      APP.test={id:APP.test.id,questions:t.questions,current:0,answers:[],menu:t.assessmentType==='summative'?'assessment_menu':'test_menu'};
      startSession(t.assessmentType==='summative'?'assessment':'test');go('test_active');break;
    }
    case 'go-review-test':
      APP.review={source:'test',items:APP.test.answers,backTo:'test_results'};go('review');break;
    case 'back-test-menu':go('test_menu');break;
    case 'back-assessment-menu':go('assessment_menu');break;
    case 'back-test-history':go('test_history');break;
    case 'back-from-review':go(APP.review.backTo||'home');break;
    case 'back-home':{
      if(APP.sessionStart){
        const h=APP.practice.history||[];
        endSession({questionsAttempted:h.length,correctAnswers:h.filter(x=>x.correct).length})
          .then(()=>go(APP.studentName?'home':'student_login'));
      }else go(APP.studentName?'home':'student_login');break;
    }

    // ── Tutor: login ─────────────────────────────────────────────
    case 'go-tutor':APP.pinBuffer='';go('tutor_login');break;
    case 'pin-key':
      if(APP.pinBuffer.length>=4)break;
      APP.pinBuffer+=v;
      document.querySelectorAll('.pin-dot').forEach((d,i)=>{
        d.classList.toggle('filled',i<APP.pinBuffer.length);
        d.classList.remove('error');
      });
      if(APP.pinBuffer.length===4)setTimeout(()=>{
        if(APP.pinBuffer===APP.tutorPin){
          APP.tutorAuth=true;APP.pinBuffer='';APP.tutorTab='sessions';go('tutor_dash');
          const jobs=[fetchLeaderboard(),fetchStudentDirectory()];
          if(APP.studentName)jobs.push(syncCloudNow());
          Promise.allSettled(jobs).then(()=>{if(APP.screen==='tutor_dash')go('tutor_dash');});
        }else{
          const dots=document.getElementById('pinDots');
          if(dots){
            dots.querySelectorAll('.pin-dot').forEach(d=>{d.classList.add('error');d.classList.remove('filled');});
            dots.classList.add('shake');
            setTimeout(()=>{dots.classList.remove('shake');
              dots.querySelectorAll('.pin-dot').forEach(d=>d.classList.remove('error'));},600);
          }
          APP.pinBuffer='';
        }
      },140);break;
    case 'pin-del':
      APP.pinBuffer=APP.pinBuffer.slice(0,-1);
      document.querySelectorAll('.pin-dot').forEach((d,i)=>
        d.classList.toggle('filled',i<APP.pinBuffer.length));break;

    // ── Tutor: dashboard ─────────────────────────────────────────
    case 'tutor-logout':APP.tutorAuth=false;go(APP.studentName?'home':'student_login');break;
    case 't-tab':APP.tutorTab=v;go('tutor_dash');break;
    case 'view-attempt':
      APP.selectedAttempt=attemptByRef(v);
      APP.selectedAttemptSource='tutor';
      if(!APP.selectedAttempt){toast('Attempt not found');go('tutor_dash');break;}
      go('tutor_test_detail');break;
    case 'open-attempt':
      APP.selectedAttempt=attemptByRef(v);
      APP.selectedAttemptSource='student';
      if(!APP.selectedAttempt){toast('Attempt not found');go('test_history');break;}
      go('attempt_detail');break;
    case 'back-to-tests':APP.tutorTab='tests';go('tutor_dash');break;

    // ── Tutor: settings ──────────────────────────────────────────
    case 'save-pin':{
      const inp=document.getElementById('newPin');
      const p=(inp?.value||'').trim();
      if(!/^\d{4}$/.test(p)){toast('PIN must be exactly 4 digits');return;}
      saveTutorPin(p).then(()=>{toast('✅ PIN updated!');if(inp)inp.value='';});break;
    }
    case 'load-student':{
      const inp=document.getElementById('studentLookupName');
      const name=normalizeStudentName(inp?.value||'');
      if(name.length<2){toast('Enter a valid student name');break;}
      if((name!==APP.studentName)&&(APP.sessions.length||APP.testAttempts.length)){
        if(!confirm('Switch to another student profile?'))break;
      }
      loadStudentByName(name).then(ok=>{
        if(!ok){toast('Could not load that student now');return;}
        APP.tutorTab='sessions';
        go('tutor_dash');
        toast('✅ Student loaded');
      });
      break;
    }
    case 'sync-now':
      if(!APP.studentName){toast('Load a student first');break;}
      if(!cloudConfigured()){toast('Cloud API not configured yet');go('tutor_dash');break;}
      syncCloudNow().then(ok=>{
        go('tutor_dash');
        toast(ok?'✅ Cloud sync complete':'Cloud sync failed (local data kept)');
      });break;
    case 'clear-data':
      {
        const hasCloud=cloudConfigured();
        if(!confirm('Delete ALL students from cloud and this device cache? This cannot be undone.'))break;
        APP.cloudStatus=hasCloud?'Cloud clearing all students...':'Local only (cloud not configured)';
        go('tutor_dash');
        const clearMark=Date.now();
        const clearLocally=async()=>{
          clearLocalSnapshotsForAllStudents();
          await setCloudClearCutoff(clearMark);
          APP.sessions=[];
          APP.testAttempts=[];
          APP.leaderboard=[];
          APP.studentDirectory=[];
          APP.selectedAttempt=null;
          APP.selectedAttemptSource='tutor';
          APP.studentName='';
          APP.cloudStudentId='';
          await persistLocalSnapshot();
          try{await storage.set(KEY_LAST_STUDENT,'');}catch{}
          await setLocalUpdated(clearMark);
          APP.cloudLastSync=hasCloud?clearMark:0;
          APP.cloudStatus=hasCloud?'Cloud synced':'Local data cleared';
          go('tutor_dash');
          toast(hasCloud?'✅ All students cleared':'Local student data cleared');
        };
        if(!hasCloud){
          clearLocally().catch(()=>toast('Could not clear local student data'));
          break;
        }
        cloudDeleteAllStudents().then(async result=>{
          let cloudCleared=result.ok;
          let clearError=result.error||'clear failed';
          if(!cloudCleared){
            const studentIds=await cloudFetchStudentIds();
            const deleteById=await cloudDeleteStudentsByIds(studentIds);
            if(deleteById.ok){
              cloudCleared=true;
            }else{
              clearError=deleteById.error||clearError;
            }
          }
          if(!cloudCleared){
            const wipeAll=await cloudWipeAllStudentProgress();
            if(wipeAll.ok){
              cloudCleared=true;
            }else{
              clearError=wipeAll.error||clearError;
            }
          }
          if(!cloudCleared){
            const studentIds=await cloudFetchStudentIds();
            const wipeById=await cloudWipeStudentsByIds(studentIds);
            if(wipeById.ok){
              cloudCleared=true;
            }else{
              clearError=wipeById.error||clearError;
            }
          }
          if(!cloudCleared){
            APP.cloudStatus=`Cloud error: ${shortCloudError(clearError)} (clear failed)`;
            go('tutor_dash');
            toast('Cloud clear failed');
            return;
          }
          await clearLocally().catch(()=>toast('Could not finish local cleanup'));
          APP.studentDirectory=[];
          await fetchLeaderboard().catch(()=>{});
          if(APP.leaderboard.length>0){
            APP.cloudStatus='Cloud clear partial (hidden locally)';
          }
          APP.leaderboard=[];
          go('tutor_dash');
        });
        break;
      }
  }
}

// ================================================================
// TOAST
// ================================================================
function toast(msg){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2D2D2D;color:white;padding:10px 20px;border-radius:20px;font-family:Fredoka,sans-serif;font-size:14px;font-weight:600;z-index:200;animation:pop .3s ease-out;white-space:nowrap;pointer-events:none';
  t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2500);
}
</script>
